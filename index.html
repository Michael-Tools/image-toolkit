<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片处理工具箱</title>
<style>
:root { --bg: #f5f5f7; --card-bg: #ffffff; --text: #1d1d1f; --text-secondary: #86868b; --border: #e5e5ea; --primary: #007aff; --primary-hover: #0062cc; --radius: 8px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
header { text-align: center; padding: 40px 0 32px; }
header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
header p { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
.tabs { display: flex; gap: 4px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
.tab { padding: 10px 18px; border: none; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 6px; white-space: nowrap; transition: all 0.15s; }
.tab:hover { background: rgba(0,0,0,0.04); }
.tab.active { background: var(--primary); color: #fff; }
.card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
.dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px; text-align: center; cursor: pointer; transition: all 0.2s; }
.dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: rgba(0,122,255,0.04); }
.dropzone p { font-size: 14px; color: var(--text-secondary); }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
input[type="range"] { width: 100%; }
input[type="text"], input[type="number"], select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: rgba(0,0,0,0.04); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.actions-bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.preview-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.preview-card-header { font-size: 12px; font-weight: 600; color: var(--text-secondary); padding: 8px 12px; background: #fafafa; border-bottom: 1px solid var(--border); }
.preview-card-body { padding: 12px; min-height: 120px; display: flex; align-items: center; justify-content: center; }
.preview-card-body img { max-width: 100%; max-height: 300px; border-radius: 4px; }
.placeholder { color: var(--text-secondary); font-size: 13px; }
.result-count { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.ratio-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.ratio-btn { padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 12px; cursor: pointer; }
.ratio-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1d1d1f; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 1000; animation: toastIn 0.3s; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.quality-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.quality-badge.good { background: #e8f5e9; color: #2e7d32; }
.quality-badge.ok { background: #fff3e0; color: #e65100; }
.quality-badge.bad { background: #ffebee; color: #c62828; }
@media (max-width: 640px) { .container { padding: 12px; } .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>图片处理工具箱</h1>
    <p>本地处理 | 隐私安全 | 8大实用功能</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</div>
<div id="toastContainer"></div>
<script>
// ========== STATE ==========
const state = { images: [], processedImages: [], watermarkImg: null, watermarkBatchImg: null };

// ========== UTILS ==========
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('#toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function createDropZone(accept, multiple, handler) {
  const dz = document.createElement('div'); dz.className = 'dropzone';
  const input = document.createElement('input'); input.type = 'file'; input.accept = accept;
  input.multiple = !!multiple; input.style.display = 'none';
  dz.appendChild(input);
  dz.innerHTML += '<p>点击或拖拽上传图片</p>';
  dz.addEventListener('click', () => input.click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); handler(e.dataTransfer.files); });
  input.addEventListener('change', () => { handler(input.files); dz.classList.remove('dragover'); });
  return dz;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => resolve({ file, img, width: img.naturalWidth, height: img.naturalHeight, dataUrl: e.target.result });
      img.onerror = () => reject(new Error('Image load failed'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ========== TOOLS ==========
const TOOLS = [
  { id: 'watermark', name: '加水印', icon: '💧' },
  { id: 'watermark-batch', name: '批量加水印', icon: '📦' },
  { id: 'watermark-remove', name: '去水印', icon: '🧹' },
  { id: 'compress', name: '图片压缩', icon: '📉' },
  { id: 'resize', name: '改尺寸', icon: '📐' },
  { id: 'collage', name: '拼图', icon: '🧩' },
  { id: 'convert', name: '格式转换', icon: '🔄' },
  { id: 'idphoto', name: '证件照', icon: '📸' },
  { id: 'exif', name: 'EXIF查看', icon: 'ℹ️' },
];

function renderTabs() {
  const tabs = $('#tabs');
  TOOLS.forEach((t, i) => {
    const btn = document.createElement('button'); btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = t.icon + ' ' + t.name; btn.dataset.id = t.id;
    btn.addEventListener('click', () => {
      $$('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTool(t.id);
    });
    tabs.appendChild(btn);
  });
}

function renderTool(id) {
  const main = $('#main');
  main.innerHTML = '';
  state.images = []; state.processedImages = [];
  state.watermarkImg = null; state.watermarkBatchImg = null;
  state._idphotoBgColor = null; state._idphotoOrigCanvas = null;
  state._idphotoClickPos = null;
  switch (id) {
    case 'watermark': renderWatermark(main); break;
    case 'watermark-batch': renderWatermarkBatch(main); break;
    case 'watermark-remove': renderWatermarkRemove(main); break;
    case 'compress': renderCompress(main); break;
    case 'resize': renderResize(main); break;
    case 'collage': renderCollage(main); break;
    case 'convert': renderConvert(main); break;
    case 'idphoto': renderIdphoto(main); break;
    case 'exif': renderExif(main); break;
  }
}

// ========== WATERMARK ==========
function renderWatermark(main) {
  main.innerHTML = `
    <div class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">图片加水印</h2>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">为单张图片添加文字或图片水印，支持位置、透明度、大小调整。</p>
      <div id="wmOrigDrop"></div>
      <div class="form-group" style="margin-top:12px;"><label>水印类型</label><select id="wmType"><option value="text">文字水印</option><option value="image">图片水印</option></select></div>
      <div id="wmTextOpts">
        <div class="form-group"><label>水印文字</label><input type="text" id="wmText" value="水印文字"></div>
        <div class="form-group"><label>字体大小</label><input type="range" id="wmSize" min="12" max="120" value="36"></div>
        <div class="form-group"><label>字体颜色</label><input type="color" id="wmColor" value="#ffffff"></div>
      </div>
      <div id="wmImageOpts" style="display:none;">
        <div id="wmImgDrop"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>透明度</label><input type="range" id="wmOpacity" min="0.1" max="1" step="0.05" value="0.5"></div>
        <div class="form-group"><label>旋转角度</label><input type="range" id="wmRotate" min="-45" max="45" value="0"></div>
      </div>
      <div class="form-group"><label>位置</label><select id="wmPos"><option value="center">居中</option><option value="topleft">左上</option><option value="topright">右上</option><option value="bottomleft">左下</option><option value="bottomright">右下</option><option value="tile">平铺</option></select></div>
      <div class="actions-bar">
        <button class="btn btn-primary" id="wmApply" disabled>应用水印</button>
        <button class="btn btn-outline" id="wmDownload" disabled>下载</button>
      </div>
      <div style="margin-top:16px;" id="wmPreview"></div>
    </div>`;
  const dropContainer = $('#wmOrigDrop');
  dropContainer.appendChild(createDropZone('image/*', false, files => {
    if (!files.length) return; state.images = []; state.processedImages = [];
    loadImage(files[0]).then(data => { state.images.push(data); $('#wmApply').disabled = false; });
  }));
  $('#wmType').addEventListener('change', function() {
    $('#wmTextOpts').style.display = this.value === 'text' ? '' : 'none';
    $('#wmImageOpts').style.display = this.value === 'image' ? '' : 'none';
  });
  const wmImgDrop = $('#wmImgDrop');
  wmImgDrop.appendChild(createDropZone('image/*', false, files => {
    if (!files.length) return;
    loadImage(files[0]).then(data => { state.watermarkImg = data; toast('水印图片已加载'); });
  }));
  $('#wmApply').addEventListener('click', () => applyWatermark());
  $('#wmDownload').addEventListener('click', () => {
    if (state.processedImages.length) downloadBlob(state.processedImages[0].blob, 'watermarked.jpg');
  });
}

async function applyWatermark() {
  if (!state.images.length) return;
  const img = state.images[0];
  const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img.img, 0, 0);
  const wmType = $('#wmType').value;
  const opacity = parseFloat($('#wmOpacity').value);
  const pos = $('#wmPos').value;
  const rotate = parseInt($('#wmRotate').value) * Math.PI / 180;
  ctx.globalAlpha = opacity;

  if (wmType === 'text') {
    const text = $('#wmText').value || 'Watermark';
    const fontSize = parseInt($('#wmSize').value);
    const color = $('#wmColor').value;
    ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
    ctx.fillStyle = color;
    const metrics = ctx.measureText(text);
    const tw = metrics.width, th = fontSize;

    const positions = {
      center: [img.width/2 - tw/2, img.height/2],
      topleft: [20, th + 20],
      topright: [img.width - tw - 20, th + 20],
      bottomleft: [20, img.height - 20],
      bottomright: [img.width - tw - 20, img.height - 20],
    };

    if (pos === 'tile') {
      for (let y = 0; y < img.height; y += th * 2) {
        for (let x = 0; x < img.width; x += tw * 2) {
          ctx.save(); ctx.translate(x + tw/2, y + th/2);
          if (rotate) ctx.rotate(rotate);
          ctx.fillText(text, -tw/2, th/2); ctx.restore();
        }
      }
    } else {
      const [px, py] = positions[pos];
      ctx.save(); ctx.translate(px + tw/2, py);
      if (rotate) ctx.rotate(rotate);
      ctx.fillText(text, -tw/2, 0); ctx.restore();
    }
  } else if (state.watermarkImg) {
    const wmImg = state.watermarkImg.img;
    const wmW = Math.min(wmImg.width, img.width * 0.3);
    const wmH = wmImg.height * (wmW / wmImg.width);
    const positions = {
      center: [img.width/2 - wmW/2, img.height/2 - wmH/2],
      topleft: [20, 20],
      topright: [img.width - wmW - 20, 20],
      bottomleft: [20, img.height - wmH - 20],
      bottomright: [img.width - wmW - 20, img.height - wmH - 20],
    };
    if (pos === 'tile') {
      for (let y = 0; y < img.height; y += wmH * 1.5) {
        for (let x = 0; x < img.width; x += wmW * 1.5) {
          ctx.save(); ctx.translate(x + wmW/2, y + wmH/2);
          if (rotate) ctx.rotate(rotate);
          ctx.drawImage(wmImg, -wmW/2, -wmH/2, wmW, wmH); ctx.restore();
        }
      }
    } else {
      const [px, py] = positions[pos];
      ctx.save(); ctx.translate(px + wmW/2, py + wmH/2);
      if (rotate) ctx.rotate(rotate);
      ctx.drawImage(wmImg, -wmW/2, -wmH/2, wmW, wmH); ctx.restore();
    }
  }

  canvas.toBlob(blob => {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    state.processedImages = [{ dataUrl, blob, size: blob.size }];
    $('#wmDownload').disabled = false;
    const prev = $('#wmPreview'); prev.innerHTML = `<img src="${dataUrl}" style="max-width:100%;max-height:400px;"><p style="font-size:12px;margin-top:6px;color:var(--text-secondary);">${formatSize(blob.size)}</p>`;
  }, 'image/jpeg', 0.92);
}

// ========== BATCH WATERMARK ==========
function renderWatermarkBatch(main) {
  main.innerHTML = `
    <div class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">批量加水印</h2>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">支持 WebP / PNG / JPEG 格式，一次批量处理多张。</p>
      <div id="wmBatchDrop"></div>
      <div class="form-group" style="margin-top:12px;"><label>水印类型</label><select id="wmBatchType"><option value="text">文字水印</option><option value="image">图片水印</option></select></div>
      <div id="wmBatchTextOpts">
        <div class="form-group"><label>水印文字</label><input type="text" id="wmBatchText" value="水印文字"></div>
        <div class="form-group"><label>字体大小</label><input type="range" id="wmBatchSize" min="12" max="120" value="36"></div>
        <div class="form-group"><label>字体颜色</label><input type="color" id="wmBatchColor" value="#ffffff"></div>
      </div>
      <div id="wmBatchImageOpts" style="display:none;"><div id="wmBatchImgDrop"></div></div>
      <div class="form-row">
        <div class="form-group"><label>透明度</label><input type="range" id="wmBatchOpacity" min="0.1" max="1" step="0.05" value="0.5"></div>
        <div class="form-group"><label>旋转角度</label><input type="range" id="wmBatchRotate" min="-45" max="45" value="0"></div>
      </div>
      <div class="form-group"><label>位置</label><select id="wmBatchPos"><option value="center">居中</option><option value="topleft">左上</option><option value="topright">右上</option><option value="bottomleft">左下</option><option value="bottomright">右下</option><option value="tile">平铺</option></select></div>
      <div class="actions-bar">
        <button class="btn btn-primary" id="wmBatchApply" disabled>批量处理</button>
        <button class="btn btn-outline" id="wmBatchDownload" disabled>全部下载 (ZIP)</button>
      </div>
      <div style="margin-top:16px;" id="wmBatchPreview"></div>
    </div>`;
  const dropContainer = $('#wmBatchDrop');
  dropContainer.appendChild(createDropZone('image/*', true, files => {
    if (!files.length) return; state.images = []; state.processedImages = [];
    Promise.all([...files].map(f => loadImage(f))).then(data => {
      state.images = data; $('#wmBatchApply').disabled = false;
      toast(`已加载 ${data.length} 张图片`);
    });
  }));
  $('#wmBatchType').addEventListener('change', function() {
    $('#wmBatchTextOpts').style.display = this.value === 'text' ? '' : 'none';
    $('#wmBatchImageOpts').style.display = this.value === 'image' ? '' : 'none';
  });
  const wmImgDrop = $('#wmBatchImgDrop');
  wmImgDrop.appendChild(createDropZone('image/*', false, files => {
    if (!files.length) return;
    loadImage(files[0]).then(data => { state.watermarkBatchImg = data; toast('水印图片已加载'); });
  }));
  $('#wmBatchApply').addEventListener('click', () => applyWatermarkBatch());
  $('#wmBatchDownload').addEventListener('click', () => {
    if (!state.processedImages.length) return;
    downloadBlob(state.processedImages[0].blob, state.processedImages.length > 1 ? 'batch.zip' : 'batch_0.jpg');
  });
}

async function applyWatermarkBatch() {
  if (!state.images.length) return;
  const wmType = $('#wmBatchType').value;
  const opacity = parseFloat($('#wmBatchOpacity').value);
  const pos = $('#wmBatchPos').value;
  const rotate = parseInt($('#wmBatchRotate').value) * Math.PI / 180;
  const text = $('#wmBatchText').value || 'Watermark';
  const fontSize = parseInt($('#wmBatchSize').value);
  const color = $('#wmBatchColor').value;
  const results = [];
  const prev = $('#wmBatchPreview'); prev.innerHTML = '<p style="font-size:13px;">处理中...</p>';

  for (const imgData of state.images) {
    const canvas = document.createElement('canvas'); canvas.width = imgData.width; canvas.height = imgData.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgData.img, 0, 0);
    ctx.globalAlpha = opacity;

    if (wmType === 'text') {
      ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
      ctx.fillStyle = color;
      const metrics = ctx.measureText(text);
      const tw = metrics.width, th = fontSize;
      const positions = {
        center: [imgData.width/2 - tw/2, imgData.height/2],
        topleft: [20, th + 20], topright: [imgData.width - tw - 20, th + 20],
        bottomleft: [20, imgData.height - 20], bottomright: [imgData.width - tw - 20, imgData.height - 20],
      };
      if (pos === 'tile') {
        for (let y = 0; y < imgData.height; y += th * 2)
          for (let x = 0; x < imgData.width; x += tw * 2) {
            ctx.save(); ctx.translate(x + tw/2, y + th/2);
            if (rotate) ctx.rotate(rotate);
            ctx.fillText(text, -tw/2, th/2); ctx.restore();
          }
      } else {
        const [px, py] = positions[pos];
        ctx.save(); ctx.translate(px + tw/2, py);
        if (rotate) ctx.rotate(rotate);
        ctx.fillText(text, -tw/2, 0); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
    results.push({ dataUrl: canvas.toDataURL('image/jpeg', 0.92), blob, size: blob.size });
  }
  state.processedImages = results;
  $('#wmBatchDownload').disabled = false;
  prev.innerHTML = `<p class="result-count">已处理 ${results.length} 张</p>` + results.map((r, i) =>
    `<div style="margin-bottom:8px;"><img src="${r.dataUrl}" style="max-width:100%;max-height:200px;"><p style="font-size:11px;color:var(--text-secondary);">${state.images[i].file.name} → ${formatSize(r.size)}</p></div>`
  ).join('');
}

// ========== WATERMARK REMOVE ==========
function renderWatermarkRemove(main) {
  main.innerHTML = `
    <div class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">图片去水印</h2>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">在预览图上点击水印位置，系统自动识别并消除。适合纯色/简单背景的水印。</p>
      <div id="wmRemoveDrop"></div>
      <div class="form-row" style="margin-top:12px;">
        <div class="form-group"><label>画笔大小</label><input type="range" id="wmRemoveSize" min="5" max="50" value="20"></div>
        <div class="form-group"><label>平滑度</label><input type="range" id="wmRemoveSmooth" min="5" max="50" value="15"></div>
      </div>
      <div class="actions-bar">
        <button class="btn btn-outline btn-sm" id="wmRemoveUndo">撤销</button>
        <button class="btn btn-outline btn-sm" id="wmRemoveClear">清除所有标记</button>
        <button class="btn btn-primary" id="wmRemoveApply" disabled>应用去除</button>
        <button class="btn btn-outline" id="wmRemoveDownload" disabled>下载</button>
      </div>
      <div style="margin-top:16px;"><div id="wmRemovePreview" style="position:relative;display:inline-block;"></div></div>
    </div>`;
  const dropContainer = $('#wmRemoveDrop');
  let origCanvas, displayCanvas, marks = [], brushSize, smoothness, imgW, imgH, scale;
  dropContainer.appendChild(createDropZone('image/*', false, async files => {
    if (!files.length) return; marks = []; state.images = [];
    const data = await loadImage(files[0]); state.images.push(data);
    imgW = data.width; imgH = data.height;
    origCanvas = document.createElement('canvas'); origCanvas.width = imgW; origCanvas.height = imgH;
    origCanvas.getContext('2d').drawImage(data.img, 0, 0);
    const maxW = Math.min(600, imgW);
    scale = maxW / imgW;
    displayCanvas = document.createElement('canvas');
    displayCanvas.width = Math.round(imgW * scale); displayCanvas.height = Math.round(imgH * scale);
    displayCanvas.style.maxWidth = '100%'; displayCanvas.style.cursor = 'crosshair';
    redrawDisplay();
    const prev = $('#wmRemovePreview'); prev.innerHTML = ''; prev.appendChild(displayCanvas);
    $('#wmRemoveApply').disabled = false;
    displayCanvas.addEventListener('mousedown', e => {
      const rect = displayCanvas.getBoundingClientRect();
      const x = Math.round((e.clientX - rect.left) / scale);
      const y = Math.round((e.clientY - rect.top) / scale);
      marks.push([x, y, parseInt($('#wmRemoveSize').value), parseInt($('#wmRemoveSmooth').value)]);
      redrawDisplay();
    });
  }));
  $('#wmRemoveUndo').addEventListener('click', () => { marks.pop(); if (displayCanvas) redrawDisplay(); });
  $('#wmRemoveClear').addEventListener('click', () => { marks = []; if (displayCanvas) redrawDisplay(); });
  function redrawDisplay() {
    if (!displayCanvas || !origCanvas) return;
    const dCtx = displayCanvas.getContext('2d');
    dCtx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
    dCtx.drawImage(origCanvas, 0, 0, displayCanvas.width, displayCanvas.height);
    dCtx.strokeStyle = 'red'; dCtx.lineWidth = 2;
    marks.forEach(([x, y, sz]) => { dCtx.beginPath(); dCtx.arc(x * scale, y * scale, sz * scale, 0, Math.PI * 2); dCtx.stroke(); });
  }
  $('#wmRemoveApply').addEventListener('click', () => applyWatermarkRemove(origCanvas, marks));

async function applyWatermarkRemove(origCanvas, marks) {
  if (!origCanvas || !marks.length) return;
  const ctx = origCanvas.getContext('2d');
  for (const [cx, cy, bSize, smooth] of marks) {
    const r = bSize + smooth;
    const x0 = Math.max(0, cx - r), y0 = Math.max(0, cy - r);
    const patchW = Math.min(r * 2, origCanvas.width - x0), patchH = Math.min(r * 2, origCanvas.height - y0);
    if (patchW <= 0 || patchH <= 0) continue;
    const patch = ctx.getImageData(x0, y0, patchW, patchH);
    const temp = ctx.getImageData(x0, y0, patchW, patchH);
    const pd = patch.data, td = temp.data;
    // Simple inpainting: average surrounding pixels outside brush zone
    for (let py = 0; py < patchH; py++) {
      for (let px = 0; px < patchW; px++) {
        const dx = px - (cx - x0), dy = py - (cy - y0);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > bSize + smooth) continue;
        let sumR = 0, sumG = 0, sumB = 0, count = 0;
        const sampleR = Math.max(2, Math.ceil(smooth));
        for (let sy = -sampleR; sy <= sampleR; sy++) {
          for (let sx = -sampleR; sx <= sampleR; sx++) {
            const nx = px + sx, ny = py + sy;
            if (nx < 0 || ny < 0 || nx >= patchW || ny >= patchH) continue;
            const nd = Math.sqrt((nx - (cx - x0)) ** 2 + (ny - (cy - y0)) ** 2);
            if (nd <= bSize + smooth) continue; // skip pixels inside removal zone
            const ni = (ny * patchW + nx) * 4;
            sumR += td[ni]; sumG += td[ni + 1]; sumB += td[ni + 2]; count++;
          }
        }
        if (count > 0) {
          const factor = dist <= bSize ? 1 : 1 - (dist - bSize) / smooth;
          const pi = (py * patchW + px) * 4;
          pd[pi] = Math.round(pd[pi] * (1 - factor) + (sumR / count) * factor);
          pd[pi + 1] = Math.round(pd[pi + 1] * (1 - factor) + (sumG / count) * factor);
          pd[pi + 2] = Math.round(pd[pi + 2] * (1 - factor) + (sumB / count) * factor);
        }
      }
    }
    ctx.putImageData(patch, x0, y0);
  }
  const blob = await new Promise(r => origCanvas.toBlob(r, 'image/jpeg', 0.92));
  state.processedImages = [{ dataUrl: origCanvas.toDataURL('image/jpeg', 0.92), blob, size: blob.size }];
  $('#wmRemoveDownload').disabled = false;

  // Update display
  const prev = $('#wmRemovePreview');
  const img = document.createElement('img');
  img.src = origCanvas.toDataURL('image/jpeg', 0.92);
  img.style.maxWidth = '100%'; img.style.maxHeight = '400px';
  prev.innerHTML = ''; prev.appendChild(img);
  toast('水印已去除');
}

async function applyCompress() {
  if (!state.images.length) return;
  const format = $('#compressFormat').value;
  const quality = parseInt($('#compressQuality').value) / 100;
  const maxSize = parseInt($('#compressMaxSize').value) || 0;
  const results = [];
  const prev = $('#compressPreview'); prev.innerHTML = '<p style="font-size:13px;">处理中...</p>';

  for (const imgData of state.images) {
    let w = imgData.width, h = imgData.height;

      const ratio = maxSize / Math.max(w, h);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
    }
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(imgData.img, 0, 0, w, h);
    const mime = format === 'jpeg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
    const blob = await new Promise(r => canvas.toBlob(r, mime, quality));
    results.push({
      dataUrl: canvas.toDataURL(mime, quality), blob, size: blob.size,
      origSize: imgData.file.size, name: imgData.file.name,
    });
  }
  state.processedImages = results;
  $('#compressDownload').disabled = false;
  const totalOrig = results.reduce((s, r) => s + r.origSize, 0);
  const totalNew = results.reduce((s, r) => s + r.size, 0);

async function applyCollage() {
  if (state.images.length < 2) return;
  const layout = $('#collageLayout').value;
  const gap = parseInt($('#collageGap').value) || 0;
  const bgColor = $('#collageBg').value;
  const imgs = state.images;

  let canvasW, canvasH;
  if (layout === 'horizontal') {
    const maxH = Math.max(...imgs.map(i => i.height));
    canvasW = imgs.reduce((s, i) => s + i.width, 0) + gap * (imgs.length - 1);
    canvasH = maxH;
  } else if (layout === 'vertical') {
    const maxW = Math.max(...imgs.map(i => i.width));
    canvasW = maxW;
    canvasH = imgs.reduce((s, i) => s + i.height, 0) + gap * (imgs.length - 1);
  } else {
    const cols = Math.ceil(Math.sqrt(imgs.length));
    const rows = Math.ceil(imgs.length / cols);
    const cellW = Math.max(...imgs.map(i => i.width));
    const cellH = Math.max(...imgs.map(i => i.height));
    canvasW = cellW * cols + gap * (cols - 1);
    canvasH = cellH * rows + gap * (rows - 1);
  }

  const canvas = document.createElement('canvas'); canvas.width = canvasW; canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvasW, canvasH);

  let x = 0, y = 0;
  if (layout === 'horizontal') {
    for (const img of imgs) {
      ctx.drawImage(img.img, x, (canvasH - img.height) / 2);
      x += img.width + gap;
    }
  } else if (layout === 'vertical') {
    for (const img of imgs) {
      ctx.drawImage(img.img, (canvasW - img.width) / 2, y);
      y += img.height + gap;
    }
  } else {
    const cols = Math.ceil(Math.sqrt(imgs.length));
    const cellW = Math.max(...imgs.map(i => i.width));
    const cellH = Math.max(...imgs.map(i => i.height));
    imgs.forEach((img, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      ctx.drawImage(img.img, col * (cellW + gap) + (cellW - img.width) / 2, row * (cellH + gap) + (cellH - img.height) / 2);
    });
  }

  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
  state.processedImages = [{ dataUrl: canvas.toDataURL('image/jpeg', 0.92), blob, size: blob.size }];
  $('#collageDownload').disabled = false;
  const prev = $('#collagePreview');
  prev.innerHTML = `<img src="${canvas.toDataURL('image/jpeg', 0.92)}" style="max-width:100%;max-height:400px;"><p style="font-size:12px;margin-top:6px;color:var(--text-secondary);">${canvasW}×${canvasH} | ${formatSize(blob.size)}</p>`;
}

          <div class="form-group"><label>新背景色</label><input type="color" id="idphotoBg" value="#ffffff" style="height:38px;padding:4px;"><div style="display:flex;gap:6px;margin-top:6px;">${['#ffffff','#438edb','#ff0000','#cccccc'].map(c => `<button class="btn btn-outline btn-sm" style="background:${c};width:24px;height:24px;padding:0;border:2px solid var(--border);" data-color="${c}"></button>`).join('')}</div></div>
          <div class="actions-bar">
            <button class="btn btn-primary" id="idphotoApply" disabled>应用背景替换</button>
            <button class="btn btn-outline" id="idphotoReset">还原</button>
            <button class="btn btn-outline" id="idphotoDownload" disabled>下载证件照</button>
          </div>
        </div>
      </div>
      <div style="margin-top:16px;display:flex;gap:16px;" id="idphotoPreviewArea">
        <div class="preview-card" style="flex:1;"><div class="preview-card-header">预览（点击人物做参考标记）</div><div class="preview-card-body" id="idphotoPreview" style="position:relative;"><span class="placeholder">上传照片后显示</span></div></div>
        <div class="preview-card" style="flex:1;"><div class="preview-card-header">裁剪结果</div><div class="preview-card-body" id="idphotoResult"><span class="placeholder">处理后显示</span></div></div>
      </div>
    </div>`;

  const dropContainer = $('#idphotoDrop');
  dropContainer.appendChild(createDropZone('image/*', false, handleIdphotoFile));

  $('#idphotoPreset').addEventListener('change', function() {
    $('#idphotoCustom').style.display = this.value === 'custom' ? 'grid' : 'none';
    if (this.value !== 'custom' && state.images.length) {
      const [w, h] = ID_PRESETS[this.value];
      renderIdphotoPreview(w, h);
    }
  });
  $('#idphotoReset').addEventListener('click', () => {
    if (state.images.length) {
      const preset = $('#idphotoPreset').value;
      const [w, h] = preset === 'custom' ? [parseInt($('#idphotoW').value), parseInt($('#idphotoH').value)] : ID_PRESETS[preset];
      renderIdphotoPreview(w, h);
    }
  });
  $('#idphotoApply').addEventListener('click', applyIdphotoBg);
  $('#idphotoDownload').addEventListener('click', () => {
    if (state.processedImages.length) downloadBlob(state.processedImages[0].blob, 'idphoto.jpg');
  });

  // Background color quick picks
  // Feather slider
  $('#idphotoFeather').addEventListener('input', function() {
    $('#idphotoFeatherVal').textContent = this.value;
    if (state._idphotoOrigCanvas) applyIdphotoBg();
  });

  main.querySelectorAll('[data-color]').forEach(btn => btn.addEventListener('click', function() {
    $('#idphotoBg').value = this.dataset.color;
    if (state._idphotoOrigCanvas) applyIdphotoBg();
  }));
}

async function handleIdphotoFile(files) {
  if (!files.length) return; state.images = []; state.processedImages = [];
  const imgData = await loadImage(files[0]); state.images.push(imgData);
  state._idphotoBgColor = null; state._idphotoOrigCanvas = null;
  state._idphotoClickPos = null;
  $('#idphotoApply').disabled = false;
  const preset = $('#idphotoPreset').value;
  const [w, h] = preset === 'custom' ? [parseInt($('#idphotoW').value), parseInt($('#idphotoH').value)] : ID_PRESETS[preset];
  renderIdphotoPreview(w, h);
}

function renderIdphotoPreview(tw, th) {
  if (!state.images.length) return; const img = state.images[0];
  const scale = Math.max(tw / img.width, th / img.height);
  const canvas = document.createElement('canvas'); canvas.width = tw; canvas.height = th;
  const ctx = canvas.getContext('2d');
  const sw = img.width * scale, sh = img.height * scale;
  const sx = (tw - sw) / 2, sy = (th - sh) / 2;
  ctx.fillStyle = '#f0f0f0'; ctx.fillRect(0, 0, tw, th);
  ctx.drawImage(img.img, sx, sy, sw, sh);
  state._idphotoOrigCanvas = canvas;

  const preview = $('#idphotoPreview');
  const maxW = 300; const pScale = Math.min(1, maxW / tw);
  const displayCanvas = document.createElement('canvas');
  displayCanvas.width = Math.round(tw * pScale); displayCanvas.height = Math.round(th * pScale);
  displayCanvas.getContext('2d').drawImage(canvas, 0, 0, displayCanvas.width, displayCanvas.height);
  preview.innerHTML = ''; preview.appendChild(displayCanvas);
  displayCanvas.style.maxWidth = '100%'; displayCanvas.style.cursor = 'crosshair';

  // Click to pick background color
  displayCanvas.onclick = function(e) {
    const rect = displayCanvas.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) / pScale);
    const y = Math.round((e.clientY - rect.top) / pScale);
    if (x < 0 || y < 0 || x >= tw || y >= th) return;
    const pixel = canvas.getContext('2d').getImageData(x, y, 1, 1).data;
    state._idphotoBgColor = [pixel[0], pixel[1], pixel[2]];
    state._idphotoClickPos = [x, y];
    const colorStr = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
    $('#idphotoPicked').style.background = colorStr;
    $('#idphotoApply').disabled = false;
    // Click is for visual reference only; algorithm uses corner detection
  };
}

function applyIdphotoBg() {
  if (!state._idphotoOrigCanvas) return;
  const srcCanvas = state._idphotoOrigCanvas;
  const srcCtx = srcCanvas.getContext('2d');
  const srcData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
  const tolerance = parseInt($('#idphotoTolerance').value);
  const newBg = $('#idphotoBg').value;
  const nr = parseInt(newBg.slice(1,3), 16), ng = parseInt(newBg.slice(3,5), 16), nb = parseInt(newBg.slice(5,7), 16);

  const pixels = srcData.data;
  const w = srcCanvas.width, h = srcCanvas.height;

  // Phase 1: Sample 4 corners to determine background reference colors
  const corners = [[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
  const cornerRGB = corners.map(([cx,cy]) => { const ci = (cy*w+cx)*4; return [pixels[ci],pixels[ci+1],pixels[ci+2]]; });

  // Average corner color for feathering blend math
  let avgR=0,avgG=0,avgB=0; cornerRGB.forEach(([cr,cg,cb])=>{avgR+=cr;avgG+=cg;avgB+=cb});
  avgR=Math.round(avgR/4);avgG=Math.round(avgG/4);avgB=Math.round(avgB/4);

  try {

  // Phase 2: Flood fill from 4 corners to identify background region
  // bgMask: 1 = background, 0 = person
  const bgMask = new Uint8Array(w * h);
  const queue = [];
  for (const [cx, cy] of corners) { queue.push(cy * w + cx); }
  let head = 0;

  while (head < queue.length) {
    const idx = queue[head++]; if (bgMask[idx]) continue;
    const pi = idx * 4;
    // Pixel is background if close to ANY corner color
    let minDist = 765;
    for (const [cr, cg, cb] of cornerRGB) {
      const d = (Math.abs(pixels[pi]-cr) + Math.abs(pixels[pi+1]-cg) + Math.abs(pixels[pi+2]-cb)) / 3;
      if (d < minDist) minDist = d;
    }
    if (minDist >= tolerance) continue;  // too different from corners = person
    bgMask[idx] = 1;  // mark as background
    const y = (idx / w) | 0, x = idx % w;
    if (x > 0 && !bgMask[idx - 1]) queue.push(idx - 1);
    if (x < w - 1 && !bgMask[idx + 1]) queue.push(idx + 1);
    if (y > 0 && !bgMask[idx - w]) queue.push(idx - w);
    if (y < h - 1 && !bgMask[idx + w]) queue.push(idx + w);
  }

  // Phase 3: Dilate person mask (shrink background) to remove edge fringes
  // This eliminates the white/colored halo at person edges after background swap
  const feather = parseInt($('#idphotoFeather').value) || 0;
  const dilateRounds = feather > 0 ? Math.ceil(feather / 2) + 2 : 2;
  for (let d = 0; d < dilateRounds; d++) {
    const prev = new Uint8Array(bgMask);
    let changed = false;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        if (!prev[idx]) continue;  // already person, skip
        // This is a background pixel; if any 4-neighbor is person, erode to person
        if ((x > 0 && !prev[idx - 1]) || (x < w - 1 && !prev[idx + 1]) ||
            (y > 0 && !prev[idx - w]) || (y < h - 1 && !prev[idx + w])) {
          bgMask[idx] = 0; changed = true;
        }
      }
    }
    if (!changed) break;
  }

  // Phase 4: Replace background pixels with new color
  for (let i = 0; i < w * h; i++) {
    if (bgMask[i]) {
      const pi = i * 4;
      pixels[pi] = nr; pixels[pi+1] = ng; pixels[pi+2] = nb;
    }
  }

  // Phase 5: Edge feathering — blend from person edge outward into new background
  if (feather > 0) {
    // Build distance map: 0=person, 1..feather=bg pixels near person edge
    const distance = new Int16Array(w * h).fill(-1);
    let edgeQ = [];

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const idx = y * w + x;
        if (bgMask[idx]) continue;  // not background, skip
        distance[idx] = 0;  // person pixel = distance 0
        if ((x > 0 && bgMask[idx - 1]) || (x < w - 1 && bgMask[idx + 1]) ||
            (y > 0 && bgMask[idx - w]) || (y < h - 1 && bgMask[idx + w])) {
          for (const [nx, ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]) {
            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
              const nidx = ny * w + nx;
              if (bgMask[nidx] && distance[nidx] === -1) {
                distance[nidx] = 1; edgeQ.push(nidx);
              }
            }
          }
        }
      }
    }

    // Expand distances outward
    let qhead = 0;
    while (qhead < edgeQ.length) {
      const idx = edgeQ[qhead++];
      const d = distance[idx];
      if (d >= feather) continue;
      const y = (idx / w) | 0, x = idx % w;
      for (const [nx, ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]) {
        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
          const nidx = ny * w + nx;
          if (bgMask[nidx] && distance[nidx] === -1) {
            distance[nidx] = d + 1; edgeQ.push(nidx);
          }
        }
      }
    }

    // Blend edge background pixels: mix original + new background
    const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;
    for (let i = 0; i < w * h; i++) {
      const d = distance[i];
      if (d <= 0 || d > feather) continue;
      // Closer to person (d=1): keep more original pixel for smooth transition
      // Farther from person (d=feather): mostly new background
      const t = d / (feather + 1);  // 0..1
      const factor = Math.pow(t, 2) * 0.6;  // smooth falloff
      const pi = i * 4;
      pixels[pi] = clamp(Math.round(pixels[pi] * (1 - factor) + nr * factor));
      pixels[pi+1] = clamp(Math.round(pixels[pi+1] * (1 - factor) + ng * factor));
      pixels[pi+2] = clamp(Math.round(pixels[pi+2] * (1 - factor) + nb * factor));
    }
  }

  srcCtx.putImageData(srcData, 0, 0);

  } catch(e) {
    toast('处理出错: ' + e.message);
    console.error(e);
    return;
  }
  // Update preview
  const displayCanvas = $('#idphotoPreview canvas');
  if (displayCanvas) {
    const pScale = displayCanvas.width / srcCanvas.width;
    displayCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, displayCanvas.width, displayCanvas.height);
  }

  // Show result
  const resultImg = document.createElement('img');
  resultImg.src = srcCanvas.toDataURL('image/jpeg', 0.92);
  resultImg.style.maxWidth = '100%'; resultImg.style.maxHeight = '300px';
  const result = $('#idphotoResult'); result.innerHTML = ''; result.appendChild(resultImg);

  // Prep download
  srcCanvas.toBlob(blob => {
    state.processedImages = [{ dataUrl: srcCanvas.toDataURL('image/jpeg', 0.92), blob, size: blob.size }];
  }, 'image/jpeg', 0.92);
  $('#idphotoDownload').disabled = false;
  toast('背景已替换');
}

// ========== EXIF VIEWER ==========
const EXIF_TAGS = {
  0x010f: '相机制造商', 0x0110: '相机型号', 0x0112: '方向', 0x0131: '软件',
  0x0132: '修改时间', 0x013b: '作者', 0x8298: '版权',
  0x8769: 'Exif子信息', 0x8825: 'GPS信息',
  0x829a: '曝光时间', 0x829d: '光圈值', 0x8822: '曝光程序',
  0x8827: 'ISO感光度', 0x9003: '拍摄时间', 0x9004: '数字化时间',
  0x9201: '快门速度', 0x9202: '光圈', 0x9204: '曝光补偿',
  0x9207: '测光模式', 0x9209: '闪光灯', 0x920a: '焦距',
  0xa001: '色彩空间', 0xa002: '图像宽度', 0xa003: '图像高度',
  0xa402: '曝光模式', 0xa406: '场景类型',
};
const GPS_TAGS = { 0x0001: '纬度参考', 0x0002: '纬度', 0x0003: '经度参考', 0x0004: '经度', 0x0005: '高度参考', 0x0006: '高度' };

function renderExif(main) {
  state.images = [];
  main.innerHTML = `
    <div class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">图片信息查看（EXIF）</h2>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">支持查看相机参数、GPS定位、拍摄时间等元数据。所有解析在本地完成。</p>
      <div id="exifDrop"></div>
      <div class="actions-bar" style="margin-top:12px;">
        <button class="btn btn-outline btn-sm" id="exifClear">清空</button>
      </div>
      <div style="margin-top:16px;" id="exifResult"></div>
    </div>`;
  const dropContainer = $('#exifDrop');
  dropContainer.appendChild(createDropZone('image/*', false, async files => {
    if (!files.length) return;
    const file = files[0];
    const result = $('#exifResult');
    result.innerHTML = '<p style="font-size:13px;">解析中...</p>';

    // Show basic file info
    let html = `<div style="margin-bottom:16px;"><strong>文件信息</strong></div>
      <table style="width:100%;font-size:13px;border-collapse:collapse;">
        <tr><td style="padding:4px 12px 4px 0;color:var(--text-secondary);">文件名</td><td>${file.name}</td></tr>
        <tr><td style="padding:4px 12px 4px 0;color:var(--text-secondary);">文件大小</td><td>${formatSize(file.size)}</td></tr>
        <tr><td style="padding:4px 12px 4px 0;color:var(--text-secondary);">类型</td><td>${file.type || '未知'}</td></tr>
      </table>`;

    // Try to parse EXIF
    try {
      const buffer = await file.arrayBuffer();
      const view = new DataView(buffer);
      let exifOffset = -1;

      // Check JPEG SOI
      if (view.getUint16(0) !== 0xFFD8) { html += '<p style="margin-top:12px;color:var(--text-secondary);">非JPEG格式，无法解析EXIF</p>'; }
      else {
        // Find EXIF APP1 marker
        let offset = 2;
        while (offset < view.byteLength) {
          if (view.getUint16(offset) === 0xFFE1) { exifOffset = offset + 4; break; }
          offset += 2 + view.getUint16(offset + 2);
        }
        if (exifOffset < 0) { html += '<p style="margin-top:12px;color:var(--text-secondary);">未找到EXIF数据</p>'; }
        else {
          // Parse TIFF header
          const tiffOffset = exifOffset;
          const littleEndian = view.getUint16(tiffOffset) === 0x4949;
          if (view.getUint16(tiffOffset + 2, littleEndian) !== 0x002A) {
            html += '<p style="margin-top:12px;color:var(--text-secondary);">EXIF格式异常</p>';
          } else {
            const ifdOffset = tiffOffset + view.getUint32(tiffOffset + 4, littleEndian);
            const entries = parseIFD(view, tiffOffset, ifdOffset, littleEndian, EXIF_TAGS);

            if (Object.keys(entries).length) {
              html += `<div style="margin:16px 0 8px;"><strong>EXIF 信息</strong></div><table style="width:100%;font-size:13px;border-collapse:collapse;">`;
              for (const [key, val] of Object.entries(entries)) {
                html += `<tr><td style="padding:4px 12px 4px 0;color:var(--text-secondary);">${key}</td><td>${formatExifVal(key, val)}</td></tr>`;
              }
              html += '</table>';

              // Show image preview
              const dataUrl = URL.createObjectURL(file);
              html += `<div style="margin-top:16px;"><img src="${dataUrl}" style="max-width:100%;max-height:300px;border-radius:4px;"></div>`;
            } else {
              html += '<p style="margin-top:12px;color:var(--text-secondary);">EXIF数据为空</p>';
            }
          }
        }
      }
    } catch (e) {
      html += `<p style="margin-top:12px;color:#c62828;">解析出错: ${e.message}</p>`;
    }
    result.innerHTML = html;
  }));
  $('#exifClear').addEventListener('click', () => { $('#exifResult').innerHTML = ''; });
}

function parseIFD(view, base, offset, le, tagMap) {
  const entries = {};
  const count = view.getUint16(base + offset, le);
  for (let i = 0; i < count; i++) {
    const entryOffset = base + offset + 2 + i * 12;
    const tag = view.getUint16(entryOffset, le);
    const type = view.getUint16(entryOffset + 2, le);
    const num = view.getUint32(entryOffset + 4, le);
    const valOffset = entryOffset + 8;
    if (tagMap[tag]) {
      let val;
      const typeSizes = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };
      const dataSize = typeSizes[type] * num;
      if (dataSize <= 4) {
        val = readValue(view, valOffset, type, num, le);
      } else {
        const dataOffset = base + view.getUint32(valOffset, le);
        val = readValue(view, dataOffset, type, num, le);
      }
      entries[tagMap[tag]] = val;
    }
  }

  // Check for sub-IFD (Exif sub)
  if (entries['Exif子信息'] && typeof entries['Exif子信息'] === 'number') {
    const subEntries = parseIFD(view, base, entries['Exif子信息'], le, EXIF_TAGS);
    Object.assign(entries, subEntries);
  }
  // Check for GPS sub-IFD
  if (entries['GPS信息'] && typeof entries['GPS信息'] === 'number') {
    const gpsEntries = parseIFD(view, base, entries['GPS信息'], le, GPS_TAGS);
    for (const [k, v] of Object.entries(gpsEntries)) {
      entries[`GPS: ${k}`] = v;
    }
  }
  return entries;
}

function readValue(view, offset, type, count, le) {
  if (type === 2) {
    // ASCII string
    const end = offset + count - 1;
    let str = '';
    for (let i = offset; i < end; i++) str += String.fromCharCode(view.getUint8(i));
    return str.replace(/\0/g, '');
  }
  if (count === 1) {
    switch (type) {
      case 1: return view.getUint8(offset);
      case 3: return view.getUint16(offset, le);
      case 4: return view.getUint32(offset, le);
      case 5: return view.getUint32(offset, le) / view.getUint32(offset + 4, le);
      case 10: return view.getInt32(offset, le) / view.getInt32(offset + 4, le);
      default: return view.getUint32(offset, le);
    }
  }
  // Array
  const arr = [];
  for (let i = 0; i < count; i++) {
    switch (type) {
      case 5: arr.push(view.getUint32(offset + i * 8, le) / view.getUint32(offset + i * 8 + 4, le)); break;
      case 10: arr.push(view.getInt32(offset + i * 8, le) / view.getInt32(offset + i * 8 + 4, le)); break;
      default: arr.push(view.getUint16(offset + i * 2, le));
    }
  }
  return arr;
}

function formatExifVal(tag, val) {
  if (tag === '曝光时间' && typeof val === 'number') return val < 1 ? `1/${Math.round(1/val)} 秒` : `${val.toFixed(2)} 秒`;
  if (tag === '光圈值' && typeof val === 'number') return `f/${val.toFixed(1)}`;
  if (tag === '焦距' && typeof val === 'number') return `${val.toFixed(0)} mm`;
  if (tag === 'ISO感光度') return `${val}`;
  if (tag === '闪光灯') return val === 0 ? '未闪光' : val === 1 ? '闪光' : val;
  if (tag === '曝光模式') return ['', '手动', '程序自动', '光圈优先', '快门优先'][val] || val;
  if (tag === '测光模式') return ['', '平均', '中央重点', '点测', '多区'][val] || val;
  if (tag === '方向') return ['', '正常', '镜像', '旋转180', '旋转180镜像', '旋转90镜像', '旋转270', '旋转270镜像', '旋转90'][val] || val;
  if (tag.startsWith('GPS: 纬度') && Array.isArray(val)) return `${val[0]}° ${val[1]}' ${val[2].toFixed(1)}"`;
  if (tag.startsWith('GPS: 经度') && Array.isArray(val)) return `${val[0]}° ${val[1]}' ${val[2].toFixed(1)}"`;
  if (typeof val === 'number' && (tag.includes('时间') || tag.includes('修改'))) {
    return formatExifDate(val);
  }
  return typeof val === 'object' ? JSON.stringify(val) : String(val);
}

function formatExifDate(str) {
  if (typeof str === 'string' && str.length >= 19) {
    return str.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1-$2-$3');
  }
  return str;
}

// ========== INIT ==========
renderTabs();
renderTool('watermark');
</script>
