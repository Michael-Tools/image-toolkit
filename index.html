<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片处理工具箱</title>
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --sidebar: #0f172a;
  --sidebar-hover: #1e293b;
  --sidebar-active: #1e3a5f;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.04);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--sidebar);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  position: fixed;
  top:0; left:0; bottom:0;
  z-index: 100;
}
.sidebar-logo {
  padding: 24px 20px 20px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.02em;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.sidebar-logo span { color: var(--primary); }
.sidebar-nav { flex:1; padding: 12px 0; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  font-size: 14px;
  color: #94a3b8;
  transition: all .15s;
  border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--sidebar-hover); color:#e2e8f0; }
.nav-item.active { background: var(--sidebar-active); color:#fff; border-left-color: var(--primary); }
.nav-item svg { width:18px; height:18px; flex-shrink:0; }
.sidebar-footer {
  padding: 12px 20px;
  border-top: 1px solid rgba(255,255,255,.06);
  font-size: 12px;
  color: #475569;
}

/* Main */
.main {
  margin-left: 220px;
  flex:1;
  padding: 32px;
  max-width: 1100px;
}
.tool-panel { display:none; }
.tool-panel.active { display:block; }

/* Card */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border:1px solid var(--border);
  padding: 24px;
}
.card+.card { margin-top:16px; }

/* Upload zone */
.drop-zone {
  border:2px dashed var(--border);
  border-radius: var(--radius);
  padding: 48px 24px;
  text-align:center;
  cursor:pointer;
  transition: all .2s;
  background: #f8fafc;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--primary);
  background: #eff6ff;
}
.drop-zone svg { width:40px; height:40px; color:var(--text-secondary); margin-bottom:12px; }
.drop-zone p { color: var(--text-secondary); font-size:14px; }
.drop-zone .file-types { font-size:12px; color:#94a3b8; margin-top:4px; }

/* Form controls */
label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
input[type="text"],
input[type="number"],
input[type="color"],
select {
  width:100%;
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:14px;
  font-family:inherit;
  color:var(--text);
  background:#fff;
  transition: border-color .15s;
}
input:focus, select:focus { outline:none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
input[type="range"] { width:100%; accent-color:var(--primary); }

.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px;
  border:none; border-radius:6px;
  font-size:13px; font-weight:600; font-family:inherit;
  cursor:pointer;
  transition: all .15s;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-hover); }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { background:#f1f5f9; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { opacity:.9; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-sm { padding:5px 10px; font-size:12px; }

/* Grid */
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.form-group { margin-bottom:14px; }
.form-group:last-child { margin-bottom:0; }

/* Preview */
.preview-area { display:flex; gap:16px; flex-wrap:wrap; }
.preview-card {
  flex:1; min-width:200px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  background:#f8fafc;
}
.preview-card-header {
  padding:8px 12px;
  font-size:12px; font-weight:600;
  border-bottom:1px solid var(--border);
  background:#fff;
  display:flex; justify-content:space-between; align-items:center;
}
.preview-card-body {
  display:flex; align-items:center; justify-content:center;
  min-height:180px;
  padding:12px;
}
.preview-card-body img { max-width:100%; max-height:300px; object-fit:contain; }
.preview-card-body .placeholder { color:var(--text-secondary); font-size:13px; }

/* Actions bar */
.actions-bar {
  display:flex; gap:8px; align-items:center;
  padding-top:16px;
}

/* Toast */
.toast {
  position:fixed; bottom:24px; right:24px;
  background:#1e293b; color:#fff;
  padding:12px 20px; border-radius:8px;
  font-size:13px; font-weight:500;
  box-shadow:var(--shadow-lg);
  z-index:1000;
  animation: slideUp .3s ease;
  display:none;
}
.toast.show { display:block; }
@keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* Collage grid */
.collage-grid { display:grid; gap:4px; }
.collage-grid .cell {
  background:#f1f5f9;
  border:2px dashed var(--border);
  border-radius:4px;
  min-height:120px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:all .15s;
  overflow:hidden;
  position:relative;
}
.collage-grid .cell:hover { border-color:var(--primary); background:#eff6ff; }
.collage-grid .cell img { width:100%; height:100%; object-fit:cover; position:absolute; top:0;left:0; }
.collage-grid .cell .cell-label { color:var(--text-secondary); font-size:12px; z-index:1; }

/* Batch list */
.batch-list { max-height:300px; overflow-y:auto; }
.batch-item {
  display:flex; align-items:center; gap:12px;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
}
.batch-item:last-child { border-bottom:none; }
.batch-item img { width:48px; height:48px; object-fit:cover; border-radius:4px; }
.batch-item .info { flex:1; min-width:0; }
.batch-item .info .name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.batch-item .info .size { font-size:11px; color:var(--text-secondary); }

/* Size comparison bar */
.size-bar { display:flex; height:8px; border-radius:4px; overflow:hidden; background:#e2e8f0; margin-top:8px; }
.size-bar .original { background:var(--text-secondary); transition:flex .3s; }
.size-bar .compressed { background:var(--success); transition:flex .3s; }
.size-info { display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px; }

/* Responsive */
@media (max-width:768px) {
  .sidebar { width:60px; }
  .sidebar-logo { font-size:0; padding:24px 0; text-align:center; }
  .sidebar-logo::after { content:'工具箱'; font-size:14px; font-weight:700; }
  .nav-item { padding:12px; justify-content:center; }
  .nav-item span:not(.nav-icon) { display:none; }
  .nav-item svg { width:20px; height:20px; }
  .sidebar-footer { display:none; }
  .main { margin-left:60px; padding:16px; }
  .form-row, .form-row-3 { grid-template-columns:1fr; }
}

/* Watermark position indicator */
.position-options {
  display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
  max-width:180px;
}
.pos-btn {
  padding:8px 4px;
  font-size:11px;
  border:1px solid var(--border);
  border-radius:4px;
  background:#fff;
  cursor:pointer;
  text-align:center;
  transition:all .15s;
}
.pos-btn:hover { border-color:var(--primary); }
.pos-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

/* Remove watermark brush area */
.brush-canvas { border:1px solid var(--border); border-radius:var(--radius); cursor:crosshair; max-width:100%; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">图片<span>工具箱</span></div>
  <nav class="sidebar-nav">
    <div class="nav-item active" data-tool="watermark-add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <span>添加水印</span>
    </div>
    <div class="nav-item" data-tool="watermark-remove">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 14.14 14.14"/></svg>
      <span>去除水印</span>
    </div>
    <div class="nav-item" data-tool="compress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>图片压缩</span>
    </div>
    <div class="nav-item" data-tool="resize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      <span>修改尺寸</span>
    </div>
    <div class="nav-item" data-tool="collage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>图片拼图</span>
    </div>
    <div class="nav-item" data-tool="convert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>格式转换</span>
    </div>
    <div class="nav-item" data-tool="idphoto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>
      <span>证件照</span>
    </div>
    <div class="nav-item" data-tool="exif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span>图片信息</span>
    </div>
  </nav>
  <div class="sidebar-footer">所有处理在本地完成，不上传服务器</div>
</aside>

<!-- Main Content -->
<main class="main" id="mainContent"></main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== State =====
const state = {
  currentTool: 'watermark-add',
  images: [],        // [{file, dataUrl, width, height}]
  processedImages: [], // [{dataUrl, blob, size}]
  watermarkText: '',
  watermarkImage: null,
  watermarkOpacity: 0.5,
  watermarkPosition: 'center',
  watermarkSize: 40,
  watermarkColor: '#000000',
  watermarkTile: false,
  removeMode: 'blur', // blur | crop | fill
  removeBrushSize: 30,
  compressQuality: 80,
  compressFormat: 'image/jpeg',
  resizeWidth: 800,
  resizeHeight: 600,
  resizeKeepRatio: true,
  collageLayout: '2x2',
  collageSpacing: 4,
  collageBg: '#ffffff',
  collageImages: [],
  batchMode: false,
};

// ===== Utils =====
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => resolve({ file, dataUrl: e.target.result, img, width: img.naturalWidth, height: img.naturalHeight });
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function canvasToBlob(canvas, format, quality) {
  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(blob), format || 'image/jpeg', quality || 0.9);
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadAll(images, prefix) {
  images.forEach((item, i) => {
    setTimeout(() => downloadBlob(item.blob, `${prefix}_${i+1}.${item.ext || 'jpg'}`), i * 200);
  });
  toast(`开始下载 ${images.length} 张图片`);
}

// ===== File Input Factory =====
function createDropZone(accept, multiple, onChange) {
  const div = document.createElement('div');
  div.className = 'drop-zone';
  div.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <p>拖拽图片到此处，或点击上传</p>
    <p class="file-types">支持 JPG、PNG、WebP、BMP${multiple ? '，可批量上传' : ''}</p>
  `;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept || 'image/*';
  if (multiple) input.multiple = true;
  input.style.display = 'none';
  div.appendChild(input);

  div.addEventListener('click', () => input.click());
  div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('dragover'); });
  div.addEventListener('dragleave', () => div.classList.remove('dragover'));
  div.addEventListener('drop', e => {
    e.preventDefault();
    div.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length) onChange(files);
  });
  input.addEventListener('change', () => {
    const files = Array.from(input.files);
    if (files.length) onChange(files);
  });
  return div;
}

// ===== Navigation =====
$$('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    $$('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    state.currentTool = item.dataset.tool;
    renderTool();
  });
});

// ===== Tool Rendering =====
function renderTool() {
  const main = $('#mainContent');
  main.innerHTML = '';
  switch(state.currentTool) {
    case 'watermark-add': renderWatermarkAdd(main); break;
    case 'watermark-remove': renderWatermarkRemove(main); break;
    case 'compress': renderCompress(main); break;
    case 'resize': renderResize(main); break;
    case 'collage': renderCollage(main); break;
    case 'convert': renderFormatConvert(main); break;
    case 'idphoto': renderIdPhoto(main); break;
    case 'exif': renderExif(main); break;
  }
}

// ========== WATERMARK ADD ==========
function renderWatermarkAdd(main) {
  main.innerHTML = `
    <div class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">添加水印</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
        <div>
          <div id="wmAddDrop"></div>
          <div class="actions-bar" style="margin-top:12px;">
            <button class="btn btn-outline btn-sm" id="wmAddClear">清空</button>
          </div>
        </div>
        <div>
          <div class="form-group">
            <label>水印类型</label>
            <select id="wmType">
              <option value="text">文字水印</option>
              <option value="image">图片水印</option>
            </select>
          </div>
          <div id="wmTextSettings">
            <div class="form-group"><label>文字内容</label><input type="text" id="wmText" value="Sample Watermark" placeholder="输入水印文字"></div>
            <div class="form-row">
              <div class="form-group"><label>字体大小</label><input type="number" id="wmSize" value="40" min="8" max="200"></div>
              <div class="form-group"><label>颜色</label><input type="color" id="wmColor" value="#000000" style="height:38px;padding:4px;"></div>
            </div>
          </div>
          <div id="wmImageSettings" style="display:none;">
            <div class="form-group"><label>水印图片</label><input type="file" id="wmImageFile" accept="image/*"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>透明度</label><input type="range" id="wmOpacity" min="0" max="100" value="50"><span style="font-size:12px;color:var(--text-secondary);" id="wmOpacityVal">50%</span></div>
          </div>
          <div class="form-group"><label>位置</label>
            <div class="position-options">
              <button class="pos-btn" data-pos="top-left">左上</button>
              <button class="pos-btn" data-pos="top">上中</button>
              <button class="pos-btn" data-pos="top-right">右上</button>
              <button class="pos-btn" data-pos="left">左中</button>
              <button class="pos-btn active" data-pos="center">居中</button>
              <button class="pos-btn" data-pos="right">右中</button>
              <button class="pos-btn" data-pos="bottom-left">左下</button>
              <button class="pos-btn" data-pos="bottom">下中</button>
              <button class="pos-btn" data-pos="bottom-right">右下</button>
            </div>
          </div>
          <div class="form-group" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="wmTile" style="width:auto;">
            <label style="margin:0;">平铺水印（满屏重复）</label>
          </div>
          <div class="actions-bar">
            <button class="btn btn-primary" id="wmApply">应用水印</button>
            <button class="btn btn-outline" id="wmDownload" disabled>下载</button>
            <button class="btn btn-outline btn-sm" id="wmBatch">批量处理</button>
          </div>
        </div>
      </div>
      <div class="preview-area" style="margin-top:16px;" id="wmPreview"></div>
    </div>
  `;

  // Setup drop zone
  const dropContainer = $('#wmAddDrop');
  dropContainer.appendChild(createDropZone('image/*', true, handleWmAddFiles));

  // Toggle watermark type
  $('#wmType').addEventListener('change', function() {
    $('#wmTextSettings').style.display = this.value === 'text' ? 'block' : 'none';
    $('#wmImageSettings').style.display = this.value === 'image' ? 'block' : 'none';
  });

  // Opacity
  $('#wmOpacity').addEventListener('input', function() {
    $('#wmOpacityVal').textContent = this.value + '%';
  });

  // Position buttons
  $$('#wmAddDrop').forEach(() => {}); // noop, handle below
  main.querySelectorAll('.pos-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      main.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      state.watermarkPosition = this.dataset.pos;
    });
  });

  // Tile
  $('#wmTile').addEventListener('change', function() {
    state.watermarkTile = this.checked;
  });

  // Watermark image
  $('#wmImageFile').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => { state.watermarkImage = e.target.result; };
    reader.readAsDataURL(file);
  });

  // Clear
  $('#wmAddClear').addEventListener('click', () => {
    state.images = [];
    state.processedImages = [];
    $('#wmDownload').disabled = true;
    $('#wmPreview').innerHTML = '';
    dropContainer.innerHTML = '';
    dropContainer.appendChild(createDropZone('image/*', true, handleWmAddFiles));
  });

  // Apply watermark
  $('#wmApply').addEventListener('click', applyWatermark);

  // Download
  $('#wmDownload').addEventListener('click', () => {
    if (state.processedImages.length === 1) {
      downloadBlob(state.processedImages[0].blob, 'watermarked.jpg');
    } else {
      downloadAll(state.processedImages, 'watermarked');
    }
  });

  // Batch
  $('#wmBatch').addEventListener('click', () => {
    if (state.images.length < 2) { toast('请先上传多张图片'); return; }
    applyWatermarkBatch();
  });
}

async function handleWmAddFiles(files) {
  state.images = [];
  state.processedImages = [];
  $('#wmDownload').disabled = true;
  $('#wmPreview').innerHTML = '';

  for (const file of files) {
    const imgData = await loadImage(file);
    state.images.push(imgData);
  }

  // Show preview
  const preview = $('#wmPreview');
  state.images.forEach((img, i) => {
    const card = document.createElement('div');
    card.className = 'preview-card';
    card.innerHTML = `
      <div class="preview-card-header"><span>原图 ${i+1}</span><span style="color:var(--text-secondary);">${img.width}x${img.height}</span></div>
      <div class="preview-card-body"><img src="${img.dataUrl}" alt=""></div>

async function applyWatermark() {
  if (!state.images.length) { toast('请先上传图片'); return; }
  const type = $('#wmType').value;

  state.processedImages = [];
  for (const imgData of state.images) {
    const canvas = document.createElement('canvas');
    canvas.width = imgData.width;
    canvas.height = imgData.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgData.img, 0, 0);

    const opacity = parseInt($('#wmOpacity').value) / 100;
    ctx.globalAlpha = opacity;

    if (type === 'text') {
      const text = $('#wmText').value || 'Watermark';
      const fontSize = parseInt($('#wmSize').value) || 40;
      const color = $('#wmColor').value;
      const tile = $('#wmTile').checked;

      ctx.fillStyle = color;
      ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
      const metrics = ctx.measureText(text);
      const tw = metrics.width;
      const th = fontSize;

      if (tile) {
        const spacing = Math.max(tw, th) * 2.5;
        for (let y = th; y < canvas.height + th; y += spacing) {
          for (let x = 0; x < canvas.width + tw; x += spacing) {
            ctx.fillText(text, x, y);
          }
        }
      } else {
        const pos = getPosition(canvas.width, canvas.height, tw, th, state.watermarkPosition);
        ctx.fillText(text, pos.x, pos.y);
      }
    } else if (type === 'image' && state.watermarkImage) {
      const wmImg = new Image();
      await new Promise(resolve => { wmImg.onload = resolve; wmImg.src = state.watermarkImage; });

      const tile = $('#wmTile').checked;
      const maxW = canvas.width * 0.4;
      const maxH = canvas.height * 0.4;
      let ww = wmImg.width, wh = wmImg.height;
      if (ww > maxW) { wh = wh * (maxW / ww); ww = maxW; }
      if (wh > maxH) { ww = ww * (maxH / wh); wh = maxH; }

      if (tile) {
        const spacing = Math.max(ww, wh) * 2;
        for (let y = 0; y < canvas.height; y += spacing) {
          for (let x = 0; x < canvas.width; x += spacing) {
            ctx.drawImage(wmImg, x, y, ww, wh);
          }
        }
      } else {
        const pos = getPosition(canvas.width, canvas.height, ww, wh, state.watermarkPosition);
        ctx.drawImage(wmImg, pos.x, pos.y, ww, wh);
      }
    }

    ctx.globalAlpha = 1;
    const blob = await canvasToBlob(canvas, 'image/jpeg', 0.92);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    state.processedImages.push({ dataUrl, blob, size: blob.size });
  }

  // Show result preview
  showProcessedPreview('wmPreview', state.images, state.processedImages);
  $('#wmDownload').disabled = false;
  toast(`已处理 ${state.processedImages.length} 张图片`);
}

async function applyWatermarkBatch() {
  await applyWatermark();
  if (state.processedImages.length > 1) {
    downloadAll(state.processedImages, 'watermarked');
  }
}

function getPosition(cw, ch, tw, th, pos) {
  const pad = 20;
  switch(pos) {
    case 'top-left': return { x: pad, y: th + pad };
    case 'top': return { x: (cw - tw) / 2, y: th + pad };
    case 'top-right': return { x: cw - tw - pad, y: th + pad };
    case 'left': return { x: pad, y: ch / 2 };
    case 'center': return { x: (cw - tw) / 2, y: ch / 2 };
    case 'right': return { x: cw - tw - pad, y: ch / 2 };
    case 'bottom-left': return { x: pad, y: ch - pad };
    case 'bottom': return { x: (cw - tw) / 2, y: ch - pad };
    case 'bottom-right': return { x: cw - tw - pad, y: ch - pad };
    default: return { x: (cw - tw) / 2, y: ch / 2 };
  }
}

function showProcessedPreview(containerId, originals, processed) {
  const preview = $('#' + containerId);
  // Remove existing result cards
  preview.querySelectorAll('.preview-card.result').forEach(c => c.remove());

  processed.forEach((p, i) => {

      <div class="preview-card-body"><img src="${p.dataUrl}" alt=""></div>
    `;
    preview.appendChild(card);
  });
}

}

async function handleWmRemoveFiles(files) {
  if (!files.length) return;
  state.images = [];
  state.processedImages = [];
  const imgData = await loadImage(files[0]);
  state.images.push(imgData);

  const canvas = $('#removeCanvas');
  const maxW = 600;
  const scale = Math.min(1, maxW / imgData.width);
  canvas.width = Math.round(imgData.width * scale);
  canvas.height = Math.round(imgData.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgData.img, 0, 0, canvas.width, canvas.height);
  canvas._origDataUrl = imgData.dataUrl;
  canvas._origImg = imgData.img;
  canvas._scale = scale;
  canvas._brushMask = new Set();

  $('#wmRemoveApply').disabled = false;
  $('#wmRemoveReset').disabled = false;
  $('#wmRemoveDownload').disabled = true;

  setupRemoveBrush(canvas);
}

function setupRemoveBrush(canvas) {
  canvas._drawing = false;
  canvas.onmousedown = e => { canvas._drawing = true; paintRemoveBrush(canvas, e); };
  canvas.onmousemove = e => { if (canvas._drawing) paintRemoveBrush(canvas, e); };
  canvas.onmouseup = () => { canvas._drawing = false; };
  canvas.onmouseleave = () => { canvas._drawing = false; };
  canvas.ontouchstart = e => { e.preventDefault(); canvas._drawing = true; paintRemoveBrush(canvas, e.touches[0]); };
  canvas.ontouchmove = e => { e.preventDefault(); if (canvas._drawing) paintRemoveBrush(canvas, e.touches[0]); };
  canvas.ontouchend = () => { canvas._drawing = false; };
}

function paintRemoveBrush(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  // Account for CSS scaling (max-width:100% compresses display size)
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  const size = parseInt($('#brushSize')?.value || 30);

  const ctx = canvas.getContext('2d');
  const mode = $('#removeMode')?.value || 'blur';

  if (mode === 'blur') {
    // Create blurred version of the current canvas area
    const strength = parseInt($('#blurStrength')?.value || 20);
    const offCanvas = document.createElement('canvas');
    offCanvas.width = size * 2; offCanvas.height = size * 2;
    const offCtx = offCanvas.getContext('2d');
    offCtx.filter = `blur(${strength}px)`;
    offCtx.drawImage(canvas, x - size, y - size, size*2, size*2, 0, 0, size*2, size*2);
    offCtx.filter = 'none';
    // Feather the edges
    const mask = document.createElement('canvas');
    mask.width = size * 2; mask.height = size * 2;
    const maskCtx = mask.getContext('2d');
    const gradient = maskCtx.createRadialGradient(size, size, size * 0.3, size, size, size);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.7, 'rgba(255,255,255,0.8)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    maskCtx.fillStyle = gradient;
    maskCtx.fillRect(0, 0, size*2, size*2);
    offCtx.globalCompositeOperation = 'destination-in';
    offCtx.drawImage(mask, 0, 0);
    ctx.drawImage(offCanvas, x - size, y - size);
  } else if (mode === 'fill') {
    const fillColor = $('#fillColor')?.value || '#ffffff';
    ctx.fillStyle = fillColor;
    ctx.beginPath();
    ctx.arc(x, y, size/2, 0, Math.PI * 2);
    ctx.fill();
  }

  canvas._brushMask.add(`${Math.round(x)},${Math.round(y)}`);
}

function resetRemoveCanvas() {
  if (!state.images.length) return;
  const canvas = $('#removeCanvas');
  const imgData = state.images[0];
  const scale = canvas._scale;
  canvas.width = Math.round(imgData.width * scale);
  canvas.height = Math.round(imgData.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgData.img, 0, 0, canvas.width, canvas.height);
  canvas._brushMask = new Set();
}

async function applyWatermarkRemove() {
  if (!state.images.length) return;
  const mode = $('#removeMode').value;
  const imgData = state.images[0];
  const canvas = $('#removeCanvas');
  const scale = canvas._scale;

  const outCanvas = document.createElement('canvas');

  if (mode === 'crop') {
    const top = parseInt($('#cropTop').value) || 0;
    const right = parseInt($('#cropRight').value) || 0;
    const bottom = parseInt($('#cropBottom').value) || 0;
    const left = parseInt($('#cropLeft').value) || 0;
    const w = imgData.width - left - right;
    const h = imgData.height - top - bottom;
    if (w <= 0 || h <= 0) { toast('裁剪参数过大'); return; }
    outCanvas.width = w;
    outCanvas.height = h;
    const ctx = outCanvas.getContext('2d');
    ctx.drawImage(imgData.img, left, top, w, h, 0, 0, w, h);
  } else if (mode === 'blur') {
    // Apply blur to masked areas on full-res image
    outCanvas.width = imgData.width;
    outCanvas.height = imgData.height;
    const ctx = outCanvas.getContext('2d');
    ctx.drawImage(imgData.img, 0, 0);

    const strength = parseInt($('#blurStrength').value || 20);
    const brushSize = parseInt($('#brushSize').value || 30);
    // Apply blur in masked regions at full resolution
    const ratio = 1 / scale;
    // Process each brush point - blur at full resolution
    const seen = new Set();
    canvas._brushMask.forEach(key => {
      const [bx, by] = key.split(',').map(Number);
      const x = Math.round(bx * ratio), y = Math.round(by * ratio);
      const s = Math.round(brushSize * ratio);
      // Create blurred patch from original image
      const patch = document.createElement('canvas');
      patch.width = s; patch.height = s;
      const pCtx = patch.getContext('2d');
      pCtx.filter = `blur(${strength * ratio}px)`;
      pCtx.drawImage(imgData.img, x - s/2, y - s/2, s, s, 0, 0, s, s);
      pCtx.filter = 'none';
      ctx.drawImage(patch, x - s/2, y - s/2);
    });
  } else if (mode === 'fill') {
    outCanvas.width = imgData.width;
    outCanvas.height = imgData.height;
    const ctx = outCanvas.getContext('2d');
    ctx.drawImage(imgData.img, 0, 0);
    const fillColor = $('#fillColor').value || '#ffffff';
    const brushSize = parseInt($('#brushSize').value || 30);
    const ratio = 1 / scale;
    ctx.fillStyle = fillColor;
    canvas._brushMask.forEach(key => {
      const [bx, by] = key.split(',').map(Number);
      const x = bx * ratio, y = by * ratio;
      const s = brushSize * ratio;
      ctx.beginPath();
      ctx.arc(x, y, s/2, 0, Math.PI*2);
      ctx.fill();
    });
  }

  const blob = await canvasToBlob(outCanvas, 'image/jpeg', 0.92);
  const dataUrl = outCanvas.toDataURL('image/jpeg', 0.92);
  state.processedImages = [{ dataUrl, blob, size: blob.size }];

  // Show result
  const preview = $('#wmRemoveDrop').parentElement;
  let resultCard = preview.querySelector('.preview-card.result');
  if (!resultCard) {
    resultCard = document.createElement('div');
    resultCard.className = 'preview-card result';
    resultCard.style.marginTop = '12px';
    preview.appendChild(resultCard);
  }
  resultCard.innerHTML = `
    <div class="preview-card-header"><span>处理结果</span><span style="color:var(--success);">${formatSize(blob.size)}</span></div>
    <div class="preview-card-body"><img src="${dataUrl}" alt=""></div>
  `;
  $('#wmRemoveDownload').disabled = false;
  toast('处理完成');
}

function getFormatExt() {
  const fmt = $('#format')?.value || 'image/jpeg';

async function handleCompressFiles(files) {

async function applyCompress() {
  if (!state.images.length) return;
  const quality = parseInt($('#quality').value) / 100;
  const format = $('#format').value;

  state.processedImages = [];
  for (const imgData of state.images) {
    const canvas = document.createElement('canvas');
    canvas.width = imgData.width;
    canvas.height = imgData.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgData.img, 0, 0);
    const blob = await canvasToBlob(canvas, format, quality);
    const dataUrl = canvas.toDataURL(format, quality);
    const ext = getFormatExt();
    state.processedImages.push({ dataUrl, blob, size: blob.size, ext, origSize: imgData.file.size });
  }

  // Show results
  const result = $('#compressResult');
  result.innerHTML = state.processedImages.map((p, i) => {
    const origSize = p.origSize;
    const ratio = origSize > 0 ? p.size / origSize : 1;

      <div style="border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:12px;">

            <div class="size-bar"><div class="compressed" style="flex:${pct};"></div><div class="original" style="flex:${100-pct};"></div></div>
            <div class="size-info"><span style="color:var(--success);">${formatSize(p.size)}</span><span>${formatSize(origSize)}</span><span>节省 ${100-pct}%</span></div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  $('#compressDownload').disabled = false;
  toast(`压缩完成，平均节省 ${Math.round(state.processedImages.reduce((s, p) => s + (1 - p.size/(p.origSize||1))*100, 0) / state.processedImages.length)}%`);
}

async function handleResizeFiles(files) {
  state.images = [];

  }
  $('#resizeApply').disabled = false;

  if (state.images.length) {

    $('#resizeW').value = img.width;
    $('#resizeH').value = img.height;
  }

  const preview = $('#resizePreview');

    </div>
  `).join('');

async function applyResize() {
  if (!state.images.length) return;
  const w = parseInt($('#resizeW').value) || 800;
  const h = parseInt($('#resizeH').value) || 600;
  const keepRatio = $('#keepRatio').checked;

  state.processedImages = [];
  for (const imgData of state.images) {
    const canvas = document.createElement('canvas');
    if (keepRatio) {
      const ratio = Math.min(w / imgData.width, h / imgData.height);
      canvas.width = Math.round(imgData.width * ratio);
      canvas.height = Math.round(imgData.height * ratio);
    } else {
      canvas.width = w;
      canvas.height = h;
    }
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgData.img, 0, 0, canvas.width, canvas.height);
    const blob = await canvasToBlob(canvas, 'image/jpeg', 0.92);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    state.processedImages.push({ dataUrl, blob, size: blob.size });
  }

  showProcessedPreview('resizePreview', state.images, state.processedImages);
  $('#resizeDownload').disabled = false;
  toast(`已调整 ${state.processedImages.length} 张图片尺寸`);
}

function getLayoutSize(layout) {
  const map = { '2x2':[2,2], '3x3':[3,3], '1x2':[1,2], '2x1':[2,1], '2x3':[2,3], '3x2':[3,2], '1x3':[1,3], '3x1':[3,1] };
  return map[layout] || [2,2];
}

function rebuildCollageGrid() {
  const grid = $('#collageGrid');
  if (!grid) return;
  const layout = $('#collageLayout').value;
  const [cols, rows] = getLayoutSize(layout);
  const total = cols * rows;

  // Ensure state array matches
  while (state.collageImages.length < total) state.collageImages.push(null);
  state.collageImages = state.collageImages.slice(0, total);

  grid.innerHTML = '';
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gap = '4px';
  grid.style.aspectRatio = `${cols}/${rows}`;

  for (let i = 0; i < total; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.aspectRatio = '1';
    if (state.collageImages[i]) {
      cell.innerHTML = `<img src="${state.collageImages[i].dataUrl}" alt=""><span class="cell-label" style="position:absolute;font-size:10px;color:rgba(255,255,255,.8);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:3px;text-shadow:none;">点击更换</span>`;
    } else {
      cell.innerHTML = `<span class="cell-label">+ 图片 ${i+1}</span>`;
    }
    cell.addEventListener('click', () => uploadCollageImage(i));
    grid.appendChild(cell);
  }

  updateCollageApply();
}

function uploadCollageImage(index) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const imgData = await loadImage(file);
    state.collageImages[index] = imgData;
    rebuildCollageGrid();
    updateCollageApply();
  };
  input.click();
}

function updateCollageApply() {
  const layout = $('#collageLayout')?.value || '2x2';
  const [cols, rows] = getLayoutSize(layout);
  const filled = state.collageImages.filter(Boolean).length;
  $('#collageApply').disabled = filled < 2;
}

async function applyCollage() {
  const layout = $('#collageLayout').value;
  const spacing = parseInt($('#collageSpacing').value) || 4;
  const bgColor = $('#collageBg').value || '#ffffff';
  const [cols, rows] = getLayoutSize(layout);

  const filled = state.collageImages.filter(Boolean);
  if (filled.length < 2) { toast('请至少上传2张图片'); return; }

  // Find max dimensions per cell
  let cellW = 0, cellH = 0;
  filled.forEach(img => { cellW = Math.max(cellW, img.width); cellH = Math.max(cellH, img.height); });

  const totalW = cellW * cols + spacing * (cols + 1);
  const totalH = cellH * rows + spacing * (rows + 1);

  const canvas = document.createElement('canvas');
  canvas.width = totalW;
  canvas.height = totalH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, totalW, totalH);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      const img = state.collageImages[idx];
      if (!img) continue;

      const dx = spacing + c * (cellW + spacing);
      const dy = spacing + r * (cellH + spacing);

      // Fit image inside cell maintaining aspect ratio
      const scale = Math.min(cellW / img.width, cellH / img.height);
      const iw = img.width * scale;
      const ih = img.height * scale;
      const ox = (cellW - iw) / 2;
      const oy = (cellH - ih) / 2;

      ctx.drawImage(img.img, dx + ox, dy + oy, iw, ih);
    }
  }

  const blob = await canvasToBlob(canvas, 'image/jpeg', 0.92);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  state.processedImages = [{ dataUrl, blob, size: blob.size }];

  $('#collagePreview').innerHTML = `<img src="${dataUrl}" style="max-width:100%;max-height:400px;">`;
  $('#collageDownload').disabled = false;
  toast(`拼图完成 ${totalW}x${totalH}`);
}

function renderIdphotoPreview(tw, th) {
  if (!state.images.length) return; const img = state.images[0];
  const scale = Math.max(tw / img.width, th / img.height);
  const canvas = document.createElement('canvas'); canvas.width = tw; canvas.height = th;
  const ctx = canvas.getContext('2d');
  const sw = img.width * scale, sh = img.height * scale;
  const sx = (tw - sw) / 2, sy = (th - sh) / 2;
  ctx.fillStyle = '#f0f0f0'; ctx.fillRect(0, 0, tw, th);
  ctx.drawImage(img.img, sx, sy, sw, sh);
  state._idphotoOrigCanvas = canvas;

  const preview = $('#idphotoPreview');
  const maxW = 300; const pScale = Math.min(1, maxW / tw);
  const displayCanvas = document.createElement('canvas');
  displayCanvas.width = Math.round(tw * pScale); displayCanvas.height = Math.round(th * pScale);
  displayCanvas.getContext('2d').drawImage(canvas, 0, 0, displayCanvas.width, displayCanvas.height);
  preview.innerHTML = ''; preview.appendChild(displayCanvas);
  displayCanvas.style.maxWidth = '100%'; displayCanvas.style.cursor = 'crosshair';

  // Click to pick background color
  displayCanvas.onclick = function(e) {
    const rect = displayCanvas.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) / pScale);
    const y = Math.round((e.clientY - rect.top) / pScale);
    if (x < 0 || y < 0 || x >= tw || y >= th) return;
    const pixel = canvas.getContext('2d').getImageData(x, y, 1, 1).data;
    state._idphotoBgColor = [pixel[0], pixel[1], pixel[2]];
    state._idphotoClickPos = [x, y];
    const colorStr = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
    $('#idphotoPicked').style.background = colorStr;
    $('#idphotoApply').disabled = false;
    // Click is for visual reference only; algorithm uses corner detection
  };
}

function applyIdphotoBg() {
  if (!state._idphotoOrigCanvas) return;
  const srcCanvas = state._idphotoOrigCanvas;
  const srcCtx = srcCanvas.getContext('2d');
  const srcData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
  const newBg = $('#idphotoBg').value;
  const nr = parseInt(newBg.slice(1,3), 16), ng = parseInt(newBg.slice(3,5), 16), nb = parseInt(newBg.slice(5,7), 16);
  const pixels = srcData.data;
  const w = srcCanvas.width, h = srcCanvas.height;

  // Sample 4 corners for old background reference
  const corners = [[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
  const cornerRGB = corners.map(([cx,cy]) => { const ci = (cy*w+cx)*4; return [pixels[ci],pixels[ci+1],pixels[ci+2]]; });
  let oldR=0,oldG=0,oldB=0; cornerRGB.forEach(([cr,cg,cb])=>{oldR+=cr;oldG+=cg;oldB+=cb});
  oldR=Math.round(oldR/4); oldG=Math.round(oldG/4); oldB=Math.round(oldB/4);

  // Auto-tune tolerance: start conservative, relax if person region too small
  const totalPx = w * h;
  let tol = 25; // start conservative
  let bgMask = null;
  let bgCount = 0;
  const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;

  try {

  // Try flood fill with increasing tolerance until person region is 5-70% of image
  for (; tol <= 60; tol += 5) {
    bgMask = new Uint8Array(totalPx);
    const fq = []; for (const [cx,cy] of corners) fq.push(cy*w+cx);
    let fh = 0;
    while (fh < fq.length) {
      const idx = fq[fh++]; if (bgMask[idx]) continue;
      const pi = idx * 4; let minD = 765;
      for (const [cr,cg,cb] of cornerRGB) {
        const d = (Math.abs(pixels[pi]-cr)+Math.abs(pixels[pi+1]-cg)+Math.abs(pixels[pi+2]-cb))/3;
        if (d < minD) minD = d;
      }
      if (minD >= tol) continue;
      bgMask[idx] = 1;
      const y = (idx/w)|0, x = idx%w;
      if (x>0&&!bgMask[idx-1]) fq.push(idx-1);
      if (x<w-1&&!bgMask[idx+1]) fq.push(idx+1);
      if (y>0&&!bgMask[idx-w]) fq.push(idx-w);
      if (y<h-1&&!bgMask[idx+w]) fq.push(idx+w);
    }
    // Count person pixels
    bgCount = 0; for (let i=0;i<totalPx;i++) if (bgMask[i]) bgCount++;
    const personPct = (totalPx - bgCount) / totalPx * 100;
    if (personPct >= 5 && personPct <= 70) break; // good range
    if (tol >= 60 && personPct < 5) { toast('未检测到人物区域，请确认照片背景为纯色'); return; }
    if (personPct > 70) { toast('背景区域太小，请确认人物未占满画面'); return; }
  }

  // Dilate person by 1px to cover anti-alias edge (shrink background)
  for (let d = 0; d < 1; d++) {
    const prev = new Uint8Array(bgMask);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
      const idx=y*w+x; if (!prev[idx]) continue;
      if ((x>0&&!prev[idx-1])||(x<w-1&&!prev[idx+1])||(y>0&&!prev[idx-w])||(y<h-1&&!prev[idx+w])) bgMask[idx]=0;
    }
  }

  // Replace background pixels: blend at boundary, solid fill deep in bg
  const dR = nr - oldR, dG = ng - oldG, dB = nb - oldB;
  // Mark bg pixels adjacent to person (1px edge zone)
  const isEdge = new Uint8Array(totalPx);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
    const idx=y*w+x; if (!bgMask[idx]) continue;
    if ((x>0&&!bgMask[idx-1])||(x<w-1&&!bgMask[idx+1])||(y>0&&!bgMask[idx-w])||(y<h-1&&!bgMask[idx+w])) isEdge[idx]=1;
  }

  // Apply: 1px edge = 65% shift toward new bg, deep bg = solid replace
  for (let i=0;i<totalPx;i++) {
    if (!bgMask[i]) continue; // person, skip
    const pi=i*4;
    if (isEdge[i]) {
      const f=0.65; pixels[pi]=clamp(Math.round(pixels[pi]+dR*f)); pixels[pi+1]=clamp(Math.round(pixels[pi+1]+dG*f)); pixels[pi+2]=clamp(Math.round(pixels[pi+2]+dB*f));
    } else {
      pixels[pi]=nr; pixels[pi+1]=ng; pixels[pi+2]=nb;
    }
  }

  srcCtx.putImageData(srcData, 0, 0);

  } catch(e) {
    toast('处理出错: ' + e.message);
    console.error(e);
    return;
  }
  // Update preview
  const displayCanvas = $('#idphotoPreview canvas');
  if (displayCanvas) {
    const pScale = displayCanvas.width / srcCanvas.width;
    displayCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, displayCanvas.width, displayCanvas.height);
  }

  // Show result
  const resultImg = document.createElement('img');
  resultImg.src = srcCanvas.toDataURL('image/jpeg', 0.92);
  resultImg.style.maxWidth = '100%'; resultImg.style.maxHeight = '300px';
  const result = $('#idphotoResult'); result.innerHTML = ''; result.appendChild(resultImg);

  // Prep download
  srcCanvas.toBlob(blob => {
    state.processedImages = [{ dataUrl: srcCanvas.toDataURL('image/jpeg', 0.92), blob, size: blob.size }];
  }, 'image/jpeg', 0.92);
  $('#idphotoDownload').disabled = false;
  toast('背景已替换');
}

// ========== EXIF VIEWER ==========
const EXIF_TAGS = {
  0x010f: '相机制造商', 0x0110: '相机型号', 0x0112: '方向', 0x0131: '软件',
  0x0132: '修改时间', 0x013b: '作者', 0x8298: '版权',
  0x8769: 'Exif子信息', 0x8825: 'GPS信息',
  0x829a: '曝光时间', 0x829d: '光圈值', 0x8822: '曝光程序',
  0x8827: 'ISO感光度', 0x9003: '拍摄时间', 0x9004: '数字化时间',
  0x9201: '快门速度', 0x9202: '光圈', 0x9204: '曝光补偿',
  0x9207: '测光模式', 0x9209: '闪光灯', 0x920a: '焦距',
  0xa001: '色彩空间', 0xa002: '图像宽度', 0xa003: '图像高度',
  0xa402: '曝光模式', 0xa406: '场景类型',
};
const GPS_TAGS = { 0x0001: '纬度参考', 0x0002: '纬度', 0x0003: '经度参考', 0x0004: '经度', 0x0005: '高度参考', 0x0006: '高度' };

function renderExif(main) {
  state.images = [];
  main.innerHTML = `
    <div class="card">
      <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">图片信息查看（EXIF）</h2>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">支持查看相机参数、GPS定位、拍摄时间等元数据。所有解析在本地完成。</p>
      <div id="exifDrop"></div>
      <div class="actions-bar" style="margin-top:12px;">
        <button class="btn btn-outline btn-sm" id="exifClear">清空</button>
      </div>
      <div style="margin-top:16px;" id="exifResult"></div>
    </div>`;

  const dropContainer = $('#exifDrop');
  dropContainer.appendChild(createDropZone('image/jpeg,image/tiff', false, handleExifFile));

  $('#exifClear').addEventListener('click', () => {
    state.images = []; $('#exifResult').innerHTML = '';
    dropContainer.innerHTML = '';
    dropContainer.appendChild(createDropZone('image/jpeg,image/tiff', false, handleExifFile));
  });
}

async function handleExifFile(files) {
  if (!files.length) return; const file = files[0]; state.images = [];
  const imgData = await loadImage(file); state.images.push(imgData);

  // Read file for EXIF
  const buffer = await file.arrayBuffer();
  const exif = parseExif(buffer);

  let html = `<div style="display:flex;gap:16px;flex-wrap:wrap;">`;
  html += `<div class="preview-card"><div class="preview-card-body"><img src="${imgData.dataUrl}" style="max-width:200px;max-height:200px;"></div></div>`;

  // Basic info
  html += `<div style="flex:1;min-width:280px;"><table style="width:100%;font-size:13px;border-collapse:collapse;">`;
  html += `<tr style="background:#f8fafc;"><td colspan="2" style="padding:8px 12px;font-weight:700;border-bottom:1px solid var(--border);">基本信息</td></tr>`;
  html += row('文件名', file.name);
  html += row('文件大小', formatSize(file.size));
  html += row('图片尺寸', `${imgData.width} × ${imgData.height}`);
  html += row('文件类型', file.type || '未知');

  if (exif) {
    const sections = { '相机信息': {}, '拍摄参数': {}, 'GPS定位': {}, '其他': {} };
    for (const [tag, val] of Object.entries(exif)) {
      const tagNum = parseInt(tag);
      if ([0x010f, 0x0110, 0x0131, 0x013b, 0x8298].includes(tagNum)) sections['相机信息'][tag] = val;
      else if ([0x829a, 0x829d, 0x8827, 0x920a, 0x9209, 0x9204, 0x9207, 0x8822, 0xa402, 0x9201, 0x9202].includes(tagNum)) sections['拍摄参数'][tag] = val;
      else if ([0x0001, 0x0002, 0x0003, 0x0004, 0x0005, 0x0006].includes(tagNum)) sections['GPS定位'][tag] = val;
      else sections['其他'][tag] = val;
    }

    for (const [section, tags] of Object.entries(sections)) {
      if (!Object.keys(tags).length) continue;
      html += `<tr style="background:#f8fafc;"><td colspan="2" style="padding:8px 12px;font-weight:700;border-bottom:1px solid var(--border);">${section}</td></tr>`;
      for (const [tag, val] of Object.entries(tags)) {
        const label = EXIF_TAGS[parseInt(tag)] || GPS_TAGS[parseInt(tag)] || `标签 0x${parseInt(tag).toString(16)}`;
        html += row(label, val);
      }
    }
  }
  html += `</table></div></div>`;

  $('#exifResult').innerHTML = html;
}

function row(label, value) {
  return `<tr><td style="padding:6px 12px;color:var(--text-secondary);white-space:nowrap;">${label}</td><td style="padding:6px 12px;font-weight:500;">${value || '-'}</td></tr>`;
}

function parseExif(buffer) {
  const dv = new DataView(buffer);
  if (dv.getUint16(0) !== 0xFFD8) return null;

  let offset = 2;
  while (offset < dv.byteLength - 4) {
    const marker = dv.getUint16(offset);
    if (marker === 0xFFE1) {
      const segLen = dv.getUint16(offset + 2);
      if (offset + 4 + 6 > dv.byteLength) break;
      const header = String.fromCharCode(dv.getUint8(offset+4), dv.getUint8(offset+5), dv.getUint8(offset+6), dv.getUint8(offset+7), dv.getUint8(offset+8), dv.getUint8(offset+9));
      if (header === 'Exif\x00\x00') {
        const tiffStart = offset + 10;
        return parseTiff(dv, tiffStart);
      }
    }
    if (marker >= 0xFFE0 && marker <= 0xFFEF) {
      offset += 2 + dv.getUint16(offset + 2);
    } else if (marker === 0xFFD8 || marker === 0xFFD9) {
      offset += 2;
    } else {
      break;
    }
  }
  return null;
}

function parseTiff(dv, start) {
  const le = dv.getUint16(start) === 0x4949;
  const readU16 = (o) => dv.getUint16(o, le);
  const readU32 = (o) => dv.getUint32(o, le);

  if (readU16(start + 2) !== 0x002A) return null;
  const ifd0 = readU32(start + 4);
  if (ifd0 < 8) return null;

  const result = {};
  const ifdPos = start + ifd0;
  parseIFD(dv, ifdPos, le, start, result);

  // Parse sub-IFDs
  if (result[0x8769]) parseIFD(dv, start + parseInt(result[0x8769]), le, start, result);
  if (result[0x8825]) parseGPS(dv, start + parseInt(result[0x8825]), le, start, result);

  return result;
}

function parseIFD(dv, offset, le, tiffStart, result) {
  const readU16 = (o) => dv.getUint16(o, le);
  const readU32 = (o) => dv.getUint32(o, le);
  const count = readU16(offset);
  if (count > 256) return;

  for (let i = 0; i < count; i++) {
    const entry = offset + 2 + i * 12;
    const tag = readU16(entry);
    const type = readU16(entry + 2);
    const num = readU32(entry + 4);
    const valOff = entry + 8;

    let value = '';
    const typeSizes = { 1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8 };
    const dataSize = (typeSizes[type] || 1) * num;

    if (dataSize <= 4) {
      // Value inline
      if (type === 2) { // ASCII
        value = String.fromCharCode(...new Uint8Array(dv.buffer, valOff, num > 0 ? num - 1 : 0));
      } else if (type === 3) { // SHORT
        value = String(readU16(valOff));
      } else if (type === 4 || type === 9) { // LONG / SLONG
        value = String(readU32(valOff));
      } else {
        const bytes = [dv.getUint8(valOff), dv.getUint8(valOff+1), dv.getUint8(valOff+2), dv.getUint8(valOff+3)];
        value = bytes.map(b => b.toString(16).padStart(2,'0')).join(' ');
      }
    } else {
      const dataOff = tiffStart + readU32(valOff);
      if (dataOff + dataSize > dv.byteLength) continue;

      if (type === 2) { // ASCII string
        value = String.fromCharCode(...new Uint8Array(dv.buffer, dataOff, num > 0 ? num - 1 : 0));
      } else if (type === 5 || type === 10) { // RATIONAL
        const numVal = readU32(dataOff);
        const denVal = readU32(dataOff + 4);
        if (denVal !== 0) value = (numVal / denVal).toFixed(4);
        else value = String(numVal);
      } else {
        value = '二进制数据';
      }
    }

    if (value) {
      // Format known values
      if (tag === 0x829a && !isNaN(parseFloat(value))) { // ExposureTime
        const v = parseFloat(value);
        value = v < 1 ? `1/${Math.round(1/v)} 秒` : `${v} 秒`;
      } else if (tag === 0x829d) { // FNumber
        value = `f/${parseFloat(value).toFixed(1)}`;
      } else if (tag === 0x920a) { // FocalLength
        value = `${parseFloat(value).toFixed(0)}mm`;
      } else if (tag === 0x8827) { // ISO
        value = `ISO ${value}`;
      } else if (tag === 0x9209) { // Flash
        const fv = parseInt(value);
        value = fv & 1 ? '闪光灯开启' : '未使用闪光灯';
      } else if (tag === 0x9204) { // ExposureBias
        const eb = parseFloat(value);
        value = `${eb > 0 ? '+' : ''}${eb} EV`;
      } else if (tag === 0x9207) { // MeteringMode
        const modes = {0:'未知',1:'平均',2:'中央重点',3:'点测光',4:'多点',5:'矩阵',6:'局部',255:'其他'};
        value = modes[parseInt(value)] || value;
      }
      result[tag] = value;
    }
  }
}

function parseGPS(dv, offset, le, tiffStart, result) {
  const readU16 = (o) => dv.getUint16(o, le);
  const readU32 = (o) => dv.getUint32(o, le);
  const count = readU16(offset);
  if (count > 256) return;

  let lat = null, lon = null, latRef = 'N', lonRef = 'E';

  for (let i = 0; i < count; i++) {
    const entry = offset + 2 + i * 12;
    const tag = readU16(entry);
    const type = readU16(entry + 2);
    const num = readU32(entry + 4);
    const valOff = entry + 8;

    if (type === 5 && num === 3) {
      const dataOff = tiffStart + readU32(valOff);
      const deg = readU32(dataOff) / readU32(dataOff + 4);
      const min = readU32(dataOff + 8) / readU32(dataOff + 12);
      const sec = readU32(dataOff + 16) / readU32(dataOff + 20);
      const coord = deg + min / 60 + sec / 3600;
      if (tag === 0x0002) lat = coord;
      if (tag === 0x0004) lon = coord;
    } else if (type === 2 && num <= 4) {
      let str = '';
      if (num <= 4) {
        for (let j = 0; j < num - 1; j++) str += String.fromCharCode(dv.getUint8(valOff + j));
      } else {
        const off = tiffStart + readU32(valOff);
        for (let j = 0; j < num - 1; j++) str += String.fromCharCode(dv.getUint8(off + j));
      }
      if (tag === 0x0001) latRef = str;
      if (tag === 0x0003) lonRef = str;
    }
  }

  if (lat !== null) result[0x0002] = `${lat.toFixed(6)}° ${latRef}`;
  if (lon !== null) result[0x0004] = `${lon.toFixed(6)}° ${lonRef}`;
}
